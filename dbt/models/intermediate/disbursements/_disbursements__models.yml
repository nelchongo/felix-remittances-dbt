version: 2

models:
  - name: int_disbursements__attempts_ranked
    description: >
      One row per payout attempt (latest status), ranked within its receipt. Adds the resolution timestamps
      from the attempt's status history, `minutes_to_resolve` and flags for first, final and retry attempts.
    columns:
      - name: disbursement_id
        description: '{{ doc("col_disbursement_id") }}'
        data_type: varchar
        data_tests: [unique, not_null]
      - name: receipt_id
        description: '{{ doc("col_receipt_id") }}'
        data_type: varchar
        data_tests:
          - not_null
          - unique:
              config:
                where: "is_final_attempt"  # exactly one final attempt per receipt
      - { name: attempt_number, description: '{{ doc("col_attempt_number") }}', data_type: integer }
      - { name: provider_name, description: '{{ doc("col_provider_name") }}', data_type: varchar }
      - { name: payout_method, description: '{{ doc("col_payout_method") }}', data_type: varchar }
      - { name: beneficiary_id, description: '{{ doc("col_beneficiary_id") }}', data_type: varchar }
      - { name: beneficiary_country, description: '{{ doc("col_beneficiary_country") }}', data_type: varchar }
      - { name: payout_amount_local, description: '{{ doc("col_payout_amount_local") }}', data_type: "decimal(18,2)" }
      - { name: payout_currency, description: "Payout currency.", data_type: varchar }
      - name: final_status
        description: 'Current status of the attempt. {{ doc("col_disbursement_status") }}'
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments: { values: [processing, completed, failed] }
      - { name: failure_reason, description: "Why the attempt failed (`invalid_account`, `provider_timeout`, ...). NULL otherwise.", data_type: varchar }
      - { name: attempted_at, description: "When the attempt started, UTC.", data_type: timestamp }
      - { name: completed_at, description: "When the attempt completed, UTC.", data_type: timestamp }
      - { name: failed_at, description: "When the attempt failed, UTC.", data_type: timestamp }
      - { name: resolved_at, description: "When the attempt completed or failed, UTC. NULL while processing.", data_type: timestamp }
      - { name: minutes_to_resolve, description: "Minutes from the start of the attempt to its resolution.", data_type: bigint }
      - { name: is_first_attempt, description: "True for attempt number 1.", data_type: boolean }
      - { name: is_final_attempt, description: "True for the receipt's latest attempt (highest attempt number).", data_type: boolean }
      - { name: is_retry, description: "True for attempts after the first (attempt number > 1).", data_type: boolean }
      - { name: is_completed, description: "True if the attempt completed (money delivered).", data_type: boolean }
      - { name: is_failed, description: "True if the attempt failed.", data_type: boolean }
      - { name: is_processing, description: "True if the attempt is still processing.", data_type: boolean }
      - { name: _loaded_at, description: '{{ doc("col_latest_loaded_at") }}', data_type: timestamp }

  - name: int_payout_providers__reliability
    description: >
      Q4 label. One row per payout provider with attempt counts and `reliability_tier` from the share of failed
      attempts (thresholds in `var('provider_failure_tiers')`); `insufficient_data` below
      `provider_min_attempts` attempts. The share itself is not stored: `payout_attempt_failure_rate` is a metric.
    columns:
      - { name: provider_name, description: '{{ doc("col_provider_name") }}', data_type: varchar, data_tests: [unique, not_null] }
      - { name: n_attempts, description: "Payout attempts through the provider.", data_type: integer }
      - { name: n_failed_attempts, description: "Failed attempts.", data_type: integer }
      - { name: n_completed_attempts, description: "Completed attempts.", data_type: integer }
      - name: reliability_tier
        description: "`healthy` (< 5% failed), `watch` (5–10%), `critical` (>= 10%), `insufficient_data`."
        data_type: varchar
        data_tests:
          - not_null
          - accepted_values:
              arguments: { values: [healthy, watch, critical, insufficient_data] }
