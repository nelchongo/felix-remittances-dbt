version: 2

# The Streamlit dashboard (dashboard/app.py): one tab per question. It runs the SQL MetricFlow generates for the
# answer saved queries (`python run.py compile-metrics` → dashboard/compiled/*.sql), so it depends on the metrics.
exposures:
  - name: dashboard
    label: Félix remittances dashboard
    type: dashboard
    maturity: medium
    url: http://localhost:8501
    description: The answers to the brief (Q1–Q8), growth KPIs and pay-in performance, one tab each.
    depends_on:
      - metric('gross_volume_usd')
      - metric('gross_volume_usd_yoy_pct')
      - metric('net_revenue_usd')
      - metric('recurring_share')
      - metric('churn_rate')
      - metric('payout_attempt_failure_rate')
      - metric('chargeback_rate')
      - metric('atv_usd')
      - metric('median_ticket_usd')
      - metric('historical_ltv_usd')
      - metric('projected_ltv_12m_usd')
      - metric('ltv_per_cohort_user')
      - metric('arpu_usd')
      - metric('card_decline_rate')
      - metric('cash_expiry_rate')
    owner: { name: Data team, email: data-platform@felixpago.com }
