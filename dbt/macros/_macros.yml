version: 2

macros:
  - name: generate_schema_name
    description: >
      Overrides dbt's default schema naming so custom schemas are used as-is
      (`raw, staging, intermediate, snapshots, core, finance, operations, growth, risk, audit`)
      instead of `<target_schema>_<custom>`. Targets named `ci_*` get a `dev_` prefix.
    arguments:
      - name: custom_schema_name
        type: string
        description: The `schema` config of the node, or none.
      - name: node
        type: any
        description: The node being compiled (unused).

  - name: log_run_results
    description: >
      `on-run-end` hook. Currently a no-op placeholder. Phase 5 makes it write one row per
      executed node to `audit.dbt_run_results`.
    arguments:
      - name: results
        type: list[any]
        description: The `results` context variable available in on-run-end hooks.

  # ---------------------------------------------------------------- cleaning
  - name: parse_timestamp
    description: >
      Parses a text timestamp into a UTC `timestamp`. Accepts ISO-8601 with `Z` (with or without
      milliseconds) and naive `YYYY-MM-DD HH:MM:SS` (written in UTC by the backend). Any other format
      returns NULL, which the `not_null` tests on staging timestamps catch.
    arguments:
      - name: column
        type: string
        description: Column (or SQL expression) holding the text timestamp.

  - name: clean_amount
    description: >
      Converts a text amount to `decimal(18, scale)`: trims it and removes thousands separators.
      Unparseable values return NULL. Negative values are kept so business-rule tests can flag them.
    arguments:
      - name: column
        type: string
        description: Column (or SQL expression) holding the text amount.
      - name: scale
        type: integer
        description: Decimal places of the result. Default 2 (money). Use 6 for FX rates.

  - name: normalize_enum
    description: Trims and lower-cases a categorical code and turns empty strings into NULL. Pair it with `accepted_values`.
    arguments:
      - name: column
        type: string
        description: Column (or SQL expression) holding the code.

  - name: mask_pii
    description: >
      Masks a PII value for analytics-facing models. `email` keeps the first character and the domain,
      `phone` keeps the last 4 digits, `text` keeps the first character.
    arguments:
      - name: column
        type: string
        description: Column (or SQL expression) to mask.
      - name: kind
        type: string
        description: One of `email`, `phone`, `text` (default).

  # ---------------------------------------------------------------- modelling
  - name: dedupe_latest
    description: >
      Returns `select * from relation` keeping one row per `partition_by`, the first by `order_by`
      (`qualify row_number() ... = 1`). Used for exact duplicates and for the latest CDC version per key.
    arguments:
      - name: relation
        type: string
        description: CTE name or relation to dedupe.
      - name: partition_by
        type: string
        description: Comma-separated key columns.
      - name: order_by
        type: string
        description: Deterministic ordering; the first row per key is kept (e.g. `updated_at desc, _loaded_at desc`).

  - name: fx_revenue
    description: >
      FX revenue in USD, `send_amount × (1 − fx_rate / reference_fx_rate)`, cast to `decimal(18,4)`.
      The single definition of FX revenue in the project. NULL when an input is NULL or the reference rate
      is not positive.
    arguments:
      - name: send_amount
        type: string
        description: Expression for the amount sent, in USD.
      - name: fx_rate
        type: string
        description: Expression for the customer rate (receive currency per USD).
      - name: reference_fx_rate
        type: string
        description: Expression for the mid-market rate at quote time.
