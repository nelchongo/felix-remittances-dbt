version: 2

macros:
  - name: generate_schema_name
    description: >
      Overrides dbt's default schema naming so custom schemas are used as-is
      (`raw, staging, intermediate, snapshots, core, finance, operations, growth, risk, audit`)
      instead of `<target_schema>_<custom>`. Targets named `ci_*` get a `dev_` prefix.
    arguments:
      - name: custom_schema_name
        type: string
        description: The `schema` config of the node, or none.
      - name: node
        type: any
        description: The node being compiled (unused).

  - name: log_run_results
    description: >
      `on-run-end` hook. Appends one row per executed node (invocation, command, node, status, execution
      time, rows affected, message) to `audit.dbt_run_results`, creating the schema and table if needed.
    arguments:
      - name: results
        type: list[any]
        description: The `results` context variable available in on-run-end hooks.

  # ---------------------------------------------------------------- cleaning
  - name: parse_timestamp
    description: >
      Parses a text timestamp into a UTC `timestamp`. Accepts ISO-8601 with `Z` (with or without
      milliseconds) and naive `YYYY-MM-DD HH:MM:SS` (written in UTC by the backend). Any other format
      returns NULL, which the `not_null` tests on staging timestamps catch.
    arguments:
      - name: column
        type: string
        description: Column (or SQL expression) holding the text timestamp.

  - name: clean_amount
    description: >
      Converts a text amount to `decimal(18, scale)`: trims it and removes thousands separators.
      Unparseable values return NULL. Negative values are kept so business-rule tests can flag them.
    arguments:
      - name: column
        type: string
        description: Column (or SQL expression) holding the text amount.
      - name: scale
        type: integer
        description: Decimal places of the result. Default 2 (money). Use 6 for FX rates.

  - name: normalize_enum
    description: Trims and lower-cases a categorical code and turns empty strings into NULL. Pair it with `accepted_values`.
    arguments:
      - name: column
        type: string
        description: Column (or SQL expression) holding the code.

  - name: mask_pii
    description: >
      Masks a PII value for analytics-facing models. `email` keeps the first character and the domain,
      `phone` keeps the last 4 digits, `text` keeps the first character.
    arguments:
      - name: column
        type: string
        description: Column (or SQL expression) to mask.
      - name: kind
        type: string
        description: One of `email`, `phone`, `text` (default).

  # ---------------------------------------------------------------- modelling
  - name: dedupe_latest
    description: >
      Returns `select * from relation` keeping one row per `partition_by`, the first by `order_by`
      (`qualify row_number() ... = 1`). Used for exact duplicates and for the latest CDC version per key.
    arguments:
      - name: relation
        type: string
        description: CTE name or relation to dedupe.
      - name: partition_by
        type: string
        description: Comma-separated key columns.
      - name: order_by
        type: string
        description: Deterministic ordering; the first row per key is kept (e.g. `updated_at desc, _loaded_at desc`).

  - name: fx_revenue
    description: >
      FX revenue in USD, `send_amount × (1 − fx_rate / reference_fx_rate)`, cast to `decimal(18,4)`.
      The single definition of FX revenue in the project. NULL when an input is NULL or the reference rate
      is not positive.
    arguments:
      - name: send_amount
        type: string
        description: Expression for the amount sent, in USD.
      - name: fx_rate
        type: string
        description: Expression for the customer rate (receive currency per USD).
      - name: reference_fx_rate
        type: string
        description: Expression for the mid-market rate at quote time.

  - name: scd2_point_in_time_join
    description: >
      Join condition from a fact to the SCD2 dimension version valid at the event time:
      `fact_key = dim.dim_key and event_ts >= dim.valid_from and event_ts < dim.valid_to`.
      Use with a left join and coalesce the surrogate key to the unknown member `'-1'`.
    arguments:
      - name: dim_alias
        type: string
        description: Alias of the dimension in the join.
      - name: fact_key
        type: string
        description: Qualified natural key on the fact side (e.g. `payments.user_id`).
      - name: dim_key
        type: string
        description: Natural key column of the dimension (e.g. `user_id`).
      - name: event_ts
        type: string
        description: Qualified event timestamp on the fact side.

  - name: unknown_member
    description: >
      Select statement for a dimension's unknown member row, typed from the model's YAML columns:
      `*_sk` columns `'-1'`, text columns `'unknown'`, other columns NULL, unless overridden.
      Combine with `union all by name`.
    arguments:
      - name: columns
        type: dict[str, any]
        description: The model's columns, normally `model.columns` (each needs a `data_type`).
      - name: overrides
        type: dict[str, str]
        description: Column name -> SQL expression, e.g. validity dates of SCD2 dimensions.

  - name: values_from_var
    description: >
      Renders a dict var (`{key: {attribute: value}}`) as an inline `values` table with columns
      `key_column` + every attribute. Replaces dbt seeds for small reference data.
    arguments:
      - name: var_name
        type: string
        description: Name of the var in dbt_project.yml.
      - name: key_column
        type: string
        description: Column name for the dict keys.

  - name: _felix_sql_literal
    description: Internal helper of `values_from_var`. Renders a Python value as a SQL literal.
    arguments:
      - name: value
        type: any
        description: Value to render (string, number, boolean or none).

  # ---------------------------------------------------------------- generic tests
  - name: test_scd2_no_overlap
    description: >
      SCD2 integrity: per key, every version has `valid_from < valid_to`, versions never overlap, and
      exactly one version is current (`valid_to` = 9999-12-31).
    arguments:
      - name: model
        type: relation
        description: Model or snapshot under test.
      - name: key
        type: string
        description: Natural key column.
      - name: valid_from
        type: string
        description: Validity start column (default `valid_from`).
      - name: valid_to
        type: string
        description: Validity end column (default `valid_to`).
      - name: current_valid_to
        type: string
        description: SQL literal marking the current version (default 9999-12-31).

  - name: safe_divide
    description: "`numerator / denominator`, NULL when the denominator is 0 or NULL. Used inside label logic only; ratios are never stored."
    arguments:
      - name: numerator
        type: string
        description: SQL expression.
      - name: denominator
        type: string
        description: SQL expression.

  - name: classify_tier
    description: >
      CASE expression that labels `expr` with ascending thresholds from a var (`{tier: upper_bound}`):
      the first tier whose bound is not reached, else `else_label`. NULL input gives NULL. Used for the
      Q2 volume segments and the Q4 provider reliability tiers.
    arguments:
      - name: expr
        type: string
        description: SQL expression to classify.
      - name: var_name
        type: string
        description: "Var holding `{tier_name: upper_bound}`."
      - name: else_label
        type: string
        description: Label when every bound is reached.
      - name: labels
        type: dict[str, str]
        description: Optional renaming of tier names to output labels.

  - name: test_no_derived_metrics_in_facts
    description: >
      Fails for every column of the model whose name looks like a derived metric (`*_rate`, `*_pct`,
      `*_ratio`, `avg_*`, `median_*`). Enforces "facts store ingredients, the semantic layer stores the formulas".
    arguments:
      - name: model
        type: relation
        description: Fact under test.
      - name: pattern
        type: string
        description: Regex for forbidden column names.

  - name: test_share_at_least
    description: Fails when the rows matching `condition` hold less than `min_share` of `sum(value_column)`.
    arguments:
      - name: model
        type: relation
        description: Model under test.
      - name: value_column
        type: string
        description: Additive column to share out (e.g. lifetime volume).
      - name: condition
        type: string
        description: SQL predicate for the segment.
      - name: min_share
        type: float
        description: Minimum share, between 0 and 1.
